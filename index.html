<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS | Tactical Command HUD</title>
    <meta name="description" content="Sovereign UAV Mission Control Interface.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>
    <div class="scanlines"></div>

    <div class="dashboard">
        <!-- Header: Strategic HUD -->
        <header class="panel header">
            <div class="logo">
                <span class="pulse">🦅</span> ARGUS <span>OMEGA</span>
            </div>
            
            <div class="mission-status-hud" style="display: flex; gap: 40px; font-family: var(--font-mono); font-size: 12px;">
                <div class="hud-item">
                    <div style="color: var(--accent-glow); margin-bottom: 4px;">MISSION CLOCK</div>
                    <div id="current-time" style="color: var(--text-head); font-weight: 800;">00:00:00</div>
                </div>
                <div class="hud-item">
                    <div style="color: var(--accent-glow); margin-bottom: 4px;">TARGET SECTOR</div>
                    <div style="color: var(--text-head); font-weight: 800;">39.9°N / 32.8°E</div>
                </div>
            </div>

            <div class="system-status" style="display: flex; gap: 20px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="pulse" style="width: 8px; height: 8px; background: var(--accent-glow); border-radius: 50%;"></div>
                    <span style="font-size: 10px; color: var(--accent-glow);">SECURE LINK</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="pulse" style="width: 8px; height: 8px; background: var(--secondary-glow); border-radius: 50%;"></div>
                    <span style="font-size: 10px; color: var(--secondary-glow);">AES-256</span>
                </div>
            </div>
        </header>

        <!-- Left: Primary Telemetry -->
        <aside class="panel telemetry-panel">
            <h2 style="font-family: var(--font-mono); font-size: 12px; margin-bottom: 20px; color: var(--accent-glow);">// CORE_TELEMETRY</h2>
            
            <!-- Artificial Horizon -->
            <div class="gyro-container">
                <div class="gyro-inner" id="gyro-inner">
                    <div class="gyro-sky"></div>
                    <div class="gyro-ground"></div>
                    <div class="gyro-line"></div>
                </div>
            </div>

            <div class="data-grid">
                <div class="data-card">
                    <div class="data-label">Altitude (MSL)</div>
                    <div class="data-value"><span id="val-alt">450.0</span><small style="font-size: 12px; margin-left: 5px;">M</small></div>
                </div>
                <div class="data-card">
                    <div class="data-label">Ground Speed</div>
                    <div class="data-value"><span id="val-vel">66.5</span><small style="font-size: 12px; margin-left: 5px;">KM/H</small></div>
                </div>
                <div class="data-card">
                    <div class="data-label">Battery Level</div>
                    <div class="data-value"><span id="val-batt">88</span><small style="font-size: 12px; margin-left: 5px;">%</small></div>
                </div>
            </div>
        </aside>

        <!-- Center: Tactical Theater -->
        <main class="panel map-view" id="map-canvas">
            <div class="radar-sweep"></div>
            
            <!-- Crosshair UI -->
            <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0, 242, 255, 0.1);"></div>
            <div style="position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(0, 242, 255, 0.1);"></div>
            
            <!-- UAV Icon -->
            <div id="uav-icon" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <path d="M20 5 L35 35 L20 28 L5 35 Z" fill="none" stroke="var(--accent-glow)" stroke-width="2"/>
                    <circle cx="20" cy="22" r="3" fill="var(--accent-glow)"/>
                </svg>
            </div>

            <!-- Target simulation will be added via JS -->
            <div id="targets-layer" style="position: absolute; inset: 0;"></div>

            <div style="position: absolute; top: 20px; left: 20px; font-family: var(--font-mono); font-size: 10px; color: var(--accent-glow);">
                SCANNING SECTOR 07-ALPHA...
            </div>
        </main>

        <!-- Right: EW Shield & Logs -->
        <aside class="panel ew-panel">
            <h2 style="font-family: var(--font-mono); font-size: 12px; margin-bottom: 20px; color: var(--accent-glow);">// EW_SPECTRUM</h2>
            
            <canvas id="spectrum-canvas"></canvas>

            <div style="margin-top: 30px;">
                <div style="display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 5px;">
                    <span>SIGNAL INTEGRITY</span>
                    <span id="val-rssi">-62 DBM</span>
                </div>
                <div style="height: 4px; background: rgba(255,255,255,0.05);">
                    <div id="bar-rssi" style="height: 100%; background: var(--accent-glow); width: 85%;"></div>
                </div>
            </div>

            <h2 style="font-family: var(--font-mono); font-size: 12px; margin-top: 40px; margin-bottom: 10px; color: var(--accent-glow);">// TACTICAL_LOG</h2>
            <div id="logs" style="font-size: 10px; font-family: var(--font-mono); color: var(--text-body); height: 180px; overflow-y: auto;">
                <div>[INIT] LOADING CORE_OS...</div>
            </div>
        </aside>

        <!-- Bottom: Control Matrix -->
        <footer class="panel control-panel">
            <button class="btn" id="btn-takeoff">Initiate Takeoff</button>
            <button class="btn" id="btn-land">Auto Land</button>
            <button class="btn" id="btn-rth">Return Home</button>
            <button class="btn btn-danger" id="btn-kill">Kill Protocol</button>
        </footer>
    </div>

    <script src="src/engine/app.js"></script>
</body>
</html>
